[General]

# Pasta com wallpapers (relativa ao tema). A cada abertura um é sorteado.
# Deixe vazio para usar sempre o Background.
WallpaperFolder=wallpapers

# Wallpaper fixo / reserva caso a pasta esteja vazia (relativo ao tema ou absoluto)
Background=wallpapers/gato2.png

# Cor usada como fallback enquanto a imagem carrega
BackgroundColor=#111111

# Aparência
TextColor=#ffffff
SecondaryTextColor=#c8c8c8
PanelColor=#151515
FieldColor=#222222
AccentColor=#ffffff
# Texto sobre a cor de destaque (botão Entrar, item selecionado)
ButtonTextColor=#111111
BorderColor=#444444
PlaceholderColor=#999999
ErrorColor=#ff7777

# Desfoque do wallpaper: 0 (desligado) a 100
Blur=40

# Escala da interface: 0 = automático (pela altura da tela), ou ex.: 1.5
Scale=0

# Data/hora. Locale define o idioma de dias/meses (vazio = idioma do sistema)
Locale=pt_BR
TimeFormat=HH:mm
DateFormat=dddd, d 'de' MMMM 'de' yyyy

# Se true, o último usuário é preenchido automaticamente
ForceLastUser=true
